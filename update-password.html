<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ครั้งแรก | MoneyMate</title>
    <!-- โหลด Supabase JS SDK -->
    <script src="https://jsdelivr.net"></script>
</head>
<body style="font-family: sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px;">

    <div style="max-width: 400px; margin: 100px auto; padding: 30px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <h2 style="margin-top: 0; color: #4ade80;">💰 MoneyMate</h2>
        <p style="color: #ccc;">กรุณาตั้งรหัสผ่านใหม่สำหรับการเข้าใช้งานครั้งแรก</p>
        
        <form id="password-form" style="margin-top: 20px;">
            <div style="margin-bottom: 20px;">
                <label for="new-password" style="display: block; margin-bottom: 8px;">รหัสผ่านใหม่:</label>
                <input type="password" id="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" required 
                       style="width: 100%; padding: 10px; box-sizing: border-box; background: #333; border: 1px solid #444; border-radius: 6px; color: #fff;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background-color: #4ade80; color: #111; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                บันทึกรหัสผ่านและเข้าสู่ระบบ
            </button>
        </form>

        <p id="status-message" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
    </div>

    <script>
        // ใส่ URL และ Anon Key ของโครงการคุณเอง
        const SUPABASE_URL = 'https://supabase.co'; 
        const SUPABASE_ANON_KEY = 'your-anon-key';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const passwordForm = document.getElementById('password-form');
        const statusMessage = document.getElementById('status-message');

        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            statusMessage.style.color = '#fff';
            statusMessage.innerText = 'กำลังบันทึกรหัสผ่านใหม่...';

            // สั่งอัปเดตรหัสผ่านใหม่ (ลิงก์จากอีเมลจะถือ Session ชั่วคราวให้ผู้ใช้หน้านี้โดยอัตโนมัติ)
            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                statusMessage.style.color = '#f87171';
                statusMessage.innerText = 'เกิดข้อผิดพลาด: ' + error.message;
            } else {
                statusMessage.style.color = '#4ade80';
                statusMessage.innerText = 'เปลี่ยนรหัสผ่านสำเร็จ! กำลังพาท่านไปหน้าหลัก...';
                
                // ถอยกลับไปหน้าแรกของ Expense Tracker บน GitHub Pages
                setTimeout(() => {
                    window.location.href = './index.html'; 
                }, 2000);
            }
        });
    </script>
</body>
</html>
