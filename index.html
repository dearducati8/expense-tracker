<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoneyMate</title>

<script src="https://jsdelivr.net"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,"Noto Sans Thai",sans-serif;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#1f2937;
    padding-bottom:90px;
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px 15px 100px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#5965f2;
}

.logout{
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:10px;
}

.login-card,
.card{
    background:white;
    border-radius:22px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.login-card{
    margin-top:80px;
}

.login-card h1{
    margin-top:0;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

label{
    display:block;
    font-size:13px;
    color:#666;
    margin:12px 0 6px;
}

button{
    cursor:pointer;
}

.primary{
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#5965f2;
    color:white;
    font-size:15px;
    font-weight:bold;
    margin-top:15px;
}

.secondary{
    width:100%;
    padding:13px;
    border:0;
    border-radius:13px;
    background:#f1f2f5;
    font-size:14px;
    font-weight:bold;
    margin-top:8px;
}

.error{
    color:#e65362;
    font-size:13px;
    margin-top:10px;
}

.hidden{
    display:none!important;
}


/* MONTH */

.month-card{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.month-navigation{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.month-button{
    width:45px;
    height:45px;
    border:0;
    border-radius:13px;
    background:#f1f2f6;
    font-size:20px;
}

.month-center{
    flex:1;
    text-align:center;
}

.month-label{
    font-size:20px;
    font-weight:bold;
}

.month-sub{
    font-size:11px;
    color:#888;
    margin-top:4px;
}


/* BALANCE */

.balance-card{
    background:linear-gradient(135deg,#5965f2,#7b83f7);
    color:white;
    padding:24px;
    border-radius:24px;
}

.balance-title{
    font-size:13px;
    opacity:.8;
}

.balance{
    font-size:34px;
    font-weight:bold;
    margin:7px 0 20px;
}

.carry{
    font-size:13px;
    opacity:.85;
    margin-bottom:15px;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summary-box{
    background:rgba(255,255,255,.15);
    padding:13px;
    border-radius:15px;
}

.summary-box small{
    display:block;
    opacity:.75;
    margin-bottom:4px;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.stat-card{
    background:white;
    padding:17px;
    border-radius:19px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat-title{
    color:#777;
    font-size:12px;
}

.stat-number{
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
}


/* LIST */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 2px 12px;
}

.section-title h2{
    font-size:18px;
    margin:0;
}

.list{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.item{
    display:flex;
    gap:12px;
    padding:15px;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:0;
}

.icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#f0f2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.info strong{
    display:block;
    font-size:14px;
}

.info small{
    color:#888;
    font-size:11px;
}

.amount-area{
    text-align:right;
}

.amount{
    font-weight:bold;
    font-size:14px;
}

.income{
    color:#15a46d;
}

.expense{
    color:#e65362;
}

.actions{
    margin-top:7px;
    display:flex;
    gap:5px;
}

.action{
    border:0;
    background:#f1f2f5;
    padding:5px 8px;
    border-radius:8px;
}

.empty{
    padding:40px 15px;
    text-align:center;
    color:#999;
}


/* ADD */

.add{
    position:fixed;
    bottom:85px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:490px;
    padding:16px;
    border:0;
    border-radius:17px;
    background:#172033;
    color:white;
    font-size:16px;
    font-weight:bold;
    z-index:20;
}


/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:520px;
    padding:22px;
    border-radius:25px 25px 0 0;
    max-height:90vh;
    overflow:auto;
}

.type-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.type-btn{
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    background:white;
    font-weight:bold;
}

.active-income{
    background:#e9faf3;
    border-color:#20b27b;
    color:#159565;
}

.active-expense{
    background:#fff0f2;
    border-color:#ed6370;
    color:#df4e5b;
}


/* PAGES */

.page{
    display:none;
}

.page.active{
    display:block;
}


/* SALARY */

.salary-net{
    background:linear-gradient(135deg,#5965f2,#7b83f7);
    color:white;
    padding:24px;
    border-radius:24px;
    margin-bottom:15px;
}

.salary-net-title{
    font-size:13px;
    opacity:.8;
}

.salary-net-number{
    font-size:34px;
    font-weight:bold;
    margin-top:8px;
}

.salary-section{
    margin-top:15px;
}

.salary-section h3{
    margin:0 0 12px;
    font-size:17px;
}

.salary-form{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    margin-bottom:15px;
}

.salary-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eee;
    font-size:14px;
    gap:15px;
}

.salary-row:last-child{
    border-bottom:0;
}

.salary-total{
    font-size:17px;
    font-weight:bold;
    padding-top:15px;
}

.salary-income{
    color:#15a46d;
}

.salary-deduction{
    color:#e65362;
}


/* OT */

.ot-info{
    margin-top:8px;
    padding:10px 12px;
    background:#f5f6fa;
    border-radius:10px;
    font-size:13px;
    color:#666;
    line-height:1.7;
}

.ot-info strong{
    color:#5965f2;
}


/* CUSTOM */

.custom-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.custom-item:last-child{
    border-bottom:0;
}

.custom-item-name{
    font-size:14px;
    flex:1;
}

.custom-actions{
    display:flex;
    gap:5px;
}

.small-btn{
    border:0;
    background:#f1f2f5;
    padding:6px 9px;
    border-radius:8px;
}


/* YEAR */

.year-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.year-card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.year-card small{
    color:#777;
    font-size:12px;
}

.year-card strong{
    display:block;
    font-size:21px;
    margin-top:6px;
}

.salary-year-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #eee;
}

.salary-year-row:last-child{
    border-bottom:0;
}

.salary-year-row small{
    color:#888;
}


/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:90;
    box-shadow:0 -3px 15px rgba(0,0,0,.05);
}

.nav-item{
    flex:1;
    text-align:center;
    color:#888;
    font-size:11px;
}

</style>
</head>
<body>

<div class="container">
    <!-- ตัวอย่างการนำบล็อกคำนวณ OT ไปใช้งานภายในหน้าของแอป -->
    <div class="salary-section">
        
        <!-- บล็อกคำนวณ OT 1 เท่า (ส่วนที่เพิ่มเข้ามาใหม่) -->
        <div class="salary-form">
            <label>OT 1 เท่า (ชั่วโมง)</label>
            <input type="number" placeholder="จำนวนชั่วโมง OT 1" id="ot-1-input">
            <div class="ot-info">
                สูตร: เงินเดือน ÷ 30 ÷ 8 × 1 × ชั่วโมง<br>
                ค่า OT 1: <strong>฿0.00</strong>
            </div>
        </div>

        <!-- บล็อกคำนวณ OT 1.5 เท่า -->
        <div class="salary-form">
            <label>OT 1.5 เท่า (ชั่วโมง)</label>
            <input type="number" placeholder="จำนวนชั่วโมง OT 1.5" id="ot-1.5-input">
            <div class="ot-info">
                สูตร: เงินเดือน ÷ 30 ÷ 8 × 1.5 × ชั่วโมง<br>
                ค่า OT 1.5: <strong>฿0.00</strong>
            </div>
        </div>

        <!-- บล็อกคำนวณ OT 3 เท่า -->
        <div class="salary-form">
            <label>OT 3 เท่า (ชั่วโมง)</label>
            <input type="number" placeholder="จำนวนชั่วโมง OT 3" id="ot-3-input">
            <div class="ot-info">
                สูตร: เงินเดือน ÷ 30 ÷ 8 × 3 × ชั่วโมง<br>
                ค่า OT 3: <strong>฿0.00</strong>
            </div>
        </div>

    </div>
</div>

</body>
</html>
