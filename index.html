<script>


/* =================================
   SUPABASE CONFIG
================================= */

const SUPABASE_URL =
"https://dhzvgerfkvmpxxkpcqcv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_serLGfs1z-YYNPAAbP6aOA_HuGxEQQ3";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================
   VARIABLES
================================= */

let items = [];

let currentType = "income";

let editId = null;


/*
เก็บเดือนที่กำลังดู
รูปแบบ YYYY-MM
*/

let currentMonth =
new Date().toISOString().slice(0,7);


/* =================================
   LOGIN
================================= */

async function login(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const error =
document.getElementById(
"loginError"
);

error.innerText = "";


const {
data,
error:loginError
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(loginError){

error.innerText =
"อีเมลหรือรหัสผ่านไม่ถูกต้อง";

return;

}


showApp();

}


/* =================================
   LOGOUT
================================= */

async function logout(){

await supabaseClient.auth.signOut();

showLogin();

}


/* =================================
   CHECK SESSION
================================= */

async function checkSession(){

const {
data
} =
await supabaseClient.auth.getSession();


if(data.session){

showApp();

}else{

showLogin();

}

}


/* =================================
   SHOW LOGIN
================================= */

function showLogin(){

document
.getElementById("loginPage")
.classList.remove("hidden");

document
.getElementById("app")
.classList.add("hidden");

document
.getElementById("addButton")
.classList.add("hidden");

}


/* =================================
   SHOW APP
================================= */

async function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("addButton")
.classList.remove("hidden");

updateMonthLabel();

await loadData();

}


/* =================================
   LOAD DATA
================================= */

async function loadData(){

const {
data,
error
} =
await supabaseClient
.from("transactions")
.select("*")
.order("date",{ascending:false});


if(error){

console.error(error);

alert(
"โหลดข้อมูลไม่สำเร็จ"
);

return;

}


items =
data || [];


render();

}


/* =================================
   CHANGE MONTH
================================= */

function changeMonth(amount){

const date =
new Date(
currentMonth+"-01T00:00:00"
);


date.setMonth(
date.getMonth()+amount
);


currentMonth =
date.toISOString().slice(0,7);


updateMonthLabel();

render();

}


/* =================================
   UPDATE MONTH LABEL
================================= */

function updateMonthLabel(){

const date =
new Date(
currentMonth+"-01T00:00:00"
);


const label =
date.toLocaleDateString(
"th-TH",
{
month:"long",
year:"numeric"
}
);


document.getElementById(
"monthLabel"
).innerText =
label;


document.getElementById(
"listTitle"
).innerText =
label;

}


/* =================================
   GET MONTH DATA
================================= */

function getMonthData(month){

return items.filter(item=>{

return item.date &&
item.date.slice(0,7) === month;

});

}


/* =================================
   GET PREVIOUS BALANCE
================================= */

function getPreviousBalance(){

let total = 0;

items.forEach(item=>{

if(!item.date)
return;


/*
เฉพาะรายการก่อนเดือนปัจจุบัน
*/

if(item.date.slice(0,7) < currentMonth){

if(item.type === "income"){

total += Number(item.amount);

}else{

total -= Number(item.amount);

}

}

});

return total;

}


/* =================================
   RENDER
================================= */

function render(){

const data =
getMonthData(currentMonth);


const income =
data
.filter(
x=>x.type==="income"
)
.reduce(
(sum,x)=>
sum+Number(x.amount),
0
);


const expense =
data
.filter(
x=>x.type==="expense"
)
.reduce(
(sum,x)=>
sum+Number(x.amount),
0
);


/*
ยอดก่อนเข้าเดือนนี้
*/

const carry =
getPreviousBalance();


/*
ยอดคงเหลือทั้งหมด
*/

const balance =
carry + income - expense;


/* BALANCE */

document.getElementById(
"balance"
).innerText =
money(balance);


/* CARRY */

document.getElementById(
"carry"
).innerText =
"ยอดยกมา " + money(carry);


/* INCOME */

document.getElementById(
"income"
).innerText =
money(income);


/* EXPENSE */

document.getElementById(
"expense"
).innerText =
money(expense);


/* COUNT */

document.getElementById(
"incomeCount"
).innerText =
data.filter(
x=>x.type==="income"
).length;


document.getElementById(
"expenseCount"
).innerText =
data.filter(
x=>x.type==="expense"
).length;


/* LIST */

const list =
document.getElementById(
"list"
);


if(data.length===0){

list.innerHTML =
`
<div class="empty">

ยังไม่มีรายการในเดือนนี้

<br><br>

กด ＋ เพิ่มรายการ

</div>
`;

return;

}


list.innerHTML =
data.map(item=>`

<div class="item">

<div class="icon">
${getIcon(item.category)}
</div>

<div class="info">

<strong>
${escapeHTML(
item.note ||
item.category
)}
</strong>

<small>

${item.category}

·

${formatDate(item.date)}

</small>

<div class="actions">

<button
class="action"
onclick="openModal('${item.id}')">

✏️

</button>

<button
class="action"
onclick="deleteItem('${item.id}')">

🗑️

</button>

</div>

</div>

<div class="amount-area">

<div class="amount ${
item.type==="income"
?"income"
:"expense"
}">

${
item.type==="income"
?"+"
:"−"
}

${money(item.amount)}

</div>

</div>

</div>

`).join("");

}


/* =================================
   OPEN MODAL
================================= */

function openModal(id=null){

editId=id;

document
.getElementById("modal")
.classList.add("show");


if(id){

const item =
items.find(
x=>String(x.id)===String(id)
);


if(!item){

closeModal();

return;

}


document.getElementById(
"modalTitle"
).innerText =
"แก้ไขรายการ";


setType(item.type);


document.getElementById(
"amount"
).value =
item.amount;


document.getElementById(
"category"
).value =
item.category;


document.getElementById(
"note"
).value =
item.note || "";


document.getElementById(
"itemDate"
).value =
item.date;


}else{

document.getElementById(
"modalTitle"
).innerText =
"เพิ่มรายการ";


document.getElementById(
"amount"
).value="";


document.getElementById(
"note"
).value="";


/*
ถ้าเพิ่มรายการจากเดือนที่เลือก
ให้วันที่เริ่มต้นเป็นเดือนนั้น
*/

document.getElementById(
"itemDate"
).value =
getDefaultDate();


setType("income");

}

}


/* =================================
   DEFAULT DATE
================================= */

function getDefaultDate(){

const today =
new Date();


const todayMonth =
today.toISOString().slice(0,7);


if(todayMonth === currentMonth){

return today
.toISOString()
.slice(0,10);

}


/*
ถ้าเปิดเดือนเก่า/เดือนถัดไป
ใช้วันที่ 1 ของเดือนนั้น
*/

return currentMonth + "-01";

}


/* =================================
   CLOSE MODAL
================================= */

function closeModal(){

document
.getElementById("modal")
.classList.remove("show");

}


/* =================================
   TYPE
================================= */

function setType(type){

currentType=type;


document.getElementById(
"incomeBtn"
).className =
"type-btn";


document.getElementById(
"expenseBtn"
).className =
"type-btn";


if(type==="income"){

document.getElementById(
"incomeBtn"
).className =
"type-btn active-income";

}else{

document.getElementById(
"expenseBtn"
).className =
"type-btn active-expense";

}

}


/* =================================
   SAVE
================================= */

async function saveItem(){

const amount =
Number(
document.getElementById(
"amount"
).value
);


const category =
document.getElementById(
"category"
).value;


const note =
document.getElementById(
"note"
).value.trim();


const date =
document.getElementById(
"itemDate"
).value;


if(!amount || amount<=0){

alert(
"กรุณากรอกจำนวนเงิน"
);

return;

}


if(!date){

alert(
"กรุณาเลือกวันที่"
);

return;

}


/*
EDIT
*/

if(editId){

const {
error
} =
await supabaseClient
.from("transactions")
.update({

type:currentType,

amount:amount,

category:category,

note:note,

date:date

})
.eq(
"id",
editId
);


if(error){

alert(
"แก้ไขไม่สำเร็จ"
);

console.error(error);

return;

}

}


/*
NEW
*/

else{

const {
data:userData
} =
await supabaseClient.auth.getUser();


const user =
userData.user;


if(!user){

alert(
"กรุณาเข้าสู่ระบบ"
);

return;

}


const {
error
} =
await supabaseClient
.from("transactions")
.insert({

user_id:user.id,

type:currentType,

amount:amount,

category:category,

note:note,

date:date

});


if(error){

alert(
"บันทึกไม่สำเร็จ"
);

console.error(error);

return;

}

}


editId=null;

closeModal();

await loadData();

}


/* =================================
   DELETE
================================= */

async function deleteItem(id){

if(
!confirm(
"ต้องการลบรายการนี้หรือไม่?"
)
)
return;


const {
error
} =
await supabaseClient
.from("transactions")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"ลบไม่สำเร็จ"
);

console.error(error);

return;

}


await loadData();

}


/* =================================
   MONEY
================================= */

function money(number){

return "฿" +
Number(number)
.toLocaleString(
"th-TH",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* =================================
   FORMAT DATE
================================= */

function formatDate(date){

return new Date(
date+"T00:00:00"
)
.toLocaleDateString(
"th-TH",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* =================================
   ICON
================================= */

function getIcon(category){

const icons={

"เงินเดือน":"💰",

"อาหาร":"🍜",

"เดินทาง":"🚗",

"ช้อปปิ้ง":"🛍️",

"บิล":"🧾",

"สุขภาพ":"❤️",
